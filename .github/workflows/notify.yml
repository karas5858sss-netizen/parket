name: Parket Notifications

on:
  schedule:
    # UTC = МСК - 3ч, пн-сб
    # ── За 60 мин до каждой пары ──────────────────────────
    - cron: '0 4 * * 1-6'    # 07:00 МСК — за час до 1й (08:00)
    - cron: '40 5 * * 1-6'   # 08:40 МСК — за час до 2й (09:40)
    - cron: '50 7 * * 1-6'   # 10:50 МСК — за час до 3й (11:50)
    - cron: '30 9 * * 1-6'   # 12:30 МСК — за час до 4й (13:30)
    - cron: '40 11 * * 1-6'  # 14:40 МСК — за час до 5й (15:40)
    - cron: '20 13 * * 1-6'  # 16:20 МСК — за час до 6й (17:20)
    # ── За 10 мин до каждой пары ──────────────────────────
    - cron: '50 4 * * 1-6'   # 07:50 МСК — за 10 мин до 1й (08:00)
    - cron: '30 6 * * 1-6'   # 09:30 МСК — за 10 мин до 2й (09:40)
    - cron: '40 8 * * 1-6'   # 11:40 МСК — за 10 мин до 3й (11:50)
    - cron: '20 10 * * 1-6'  # 13:20 МСК — за 10 мин до 4й (13:30)
    - cron: '30 12 * * 1-6'  # 15:30 МСК — за 10 мин до 5й (15:40)
    - cron: '10 14 * * 1-6'  # 17:10 МСК — за 10 мин до 6й (17:20)
    # ── ДЗ + завтрашние пары ──────────────────────────────
    - cron: '0 14 * * 1-6'   # 17:00 МСК — ежедневно
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Run notifications
        env:
          TG_TOKEN:   ${{ secrets.TG_TOKEN }}
          TG_CHATID:  ${{ secrets.TG_CHATID }}
          GROUP_ID:   '271'
          VERCEL_URL: 'https://project-a2kdz.vercel.app/api/schedule'
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');

          const SENT = '/tmp/parket_sent.json';
          function loadSent() { try{return JSON.parse(fs.readFileSync(SENT,'utf8'));}catch{return{};} }
          function markSent(k) { const s=loadSent(); s[k]=Date.now(); fs.writeFileSync(SENT,JSON.stringify(s)); }
          function wasSent(k,ms) { const s=loadSent(); return s[k]&&(Date.now()-s[k])<ms; }

          function get(url) {
            return new Promise((res,rej)=>{
              https.get(url,r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>{try{res(JSON.parse(d));}catch(e){rej(e);}});}).on('error',rej);
            });
          }
          function send(token,chatId,text) {
            return new Promise((res,rej)=>{
              const body=JSON.stringify({chat_id:chatId,text,parse_mode:'HTML'});
              const req=https.request({hostname:'api.telegram.org',path:'/bot'+token+'/sendMessage',method:'POST',
                headers:{'Content-Type':'application/json','Content-Length':Buffer.byteLength(body)}},
                r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>res(JSON.parse(d)));});
              req.on('error',rej);req.write(body);req.end();
            });
          }

          function t2m(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
          function pad(n){return String(n).padStart(2,'0');}
          const DOW=['вс','пн','вт','ср','чт','пт','сб'];
          const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
          function fmtDate(ds){const d=new Date(ds+'T00:00:00');return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()];}

          async function main() {
            const token  = process.env.TG_TOKEN;
            const chatId = process.env.TG_CHATID;
            const gid    = process.env.GROUP_ID;

            const nowUTC = new Date();
            const nowMSK = new Date(nowUTC.getTime()+3*60*60*1000);
            const today  = nowMSK.toISOString().split('T')[0];
            const nowMin = nowMSK.getUTCHours()*60+nowMSK.getUTCMinutes();
            const hh=pad(nowMSK.getUTCHours()), mm=pad(nowMSK.getUTCMinutes());
            console.log('МСК:', hh+':'+mm, '|', today);

            const data = await get(process.env.VERCEL_URL+'?groupId='+gid);
            if(!data.ok||!data.lessons){console.log('API error');return;}

            // Пары сегодня
            const todayLess = data.lessons.filter(l=>l.date===today).sort((a,b)=>t2m(a.ts)-t2m(b.ts));

            // Пары завтра
            const tmrDate = new Date(nowMSK.getTime()+24*60*60*1000).toISOString().split('T')[0];
            const tmrLess = data.lessons.filter(l=>l.date===tmrDate).sort((a,b)=>t2m(a.ts)-t2m(b.ts));

            // ── 17:00: ДЗ + завтра ─────────────────────────────────
            const keyEvening = today+'_evening';
            if(nowMin>=1010&&nowMin<=1030&&!wasSent(keyEvening,2*60*60*1000)){
              let msg = '🌆 <b>Вечернее напоминание</b>\n';

              // Завтрашние пары
              if(tmrLess.length>0){
                msg += '\n📅 <b>Завтра ('+fmtDate(tmrDate)+'):</b>\n';
                tmrLess.forEach(l=>{
                  msg += '  🕐 '+l.ts+' '+l.name+' · ауд. '+l.room+'\n';
                });
              } else {
                msg += '\n✅ Завтра пар нет\n';
              }

              msg += '\n📋 Не забудь проверить ДЗ в ПАР·КЕТ 👇';
              await send(token,chatId,msg);
              markSent(keyEvening);
              console.log('✅ Вечернее напоминание отправлено');
              return;
            }

            if(!todayLess.length){console.log('Сегодня пар нет');return;}

            // ── За 60 мин до первой пары дня ────────────────────────
            const first = todayLess[0];
            const diffFirst = t2m(first.ts)-nowMin;
            const keyFirst = today+'_first_'+first.ts;
            if(diffFirst>=40&&diffFirst<=75&&!wasSent(keyFirst,50*60*1000)){
              await send(token,chatId,
                '🔔 <b>Первая пара через ~'+diffFirst+' мин!</b>\n\n'+
                '📚 '+first.name+'\n🕐 '+first.ts+' – '+first.te+
                '\n🏫 Ауд. '+first.room+'\n👤 '+first.teacher
              );
              markSent(keyFirst);
              console.log('✅ Первая пара через',diffFirst,'мин');
              return;
            }

            // ── За 10 мин до каждой пары ─────────────────────────────
            for(const l of todayLess){
              const diff=t2m(l.ts)-nowMin;
              const key=today+'_before_'+l.ts;
              if(diff>=5&&diff<=20&&!wasSent(key,15*60*1000)){
                const isFirst=l===todayLess[0];
                await send(token,chatId,
                  (isFirst?'⚡ <b>Первая':'⚡ <b>Следующая')+' пара через ~'+diff+' мин!</b>\n\n'+
                  '📚 '+l.name+'\n🕐 '+l.ts+' – '+l.te+
                  '\n🏫 Ауд. '+l.room+'\n👤 '+l.teacher
                );
                markSent(key);
                console.log('✅ Пара через',diff,'мин',l.ts);
                return;
              }
            }

            console.log('Нет уведомлений для',hh+':'+mm);
          }

          main().catch(e=>{console.error(e);process.exit(1);});
          "
